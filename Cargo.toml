[package]
name = "ccfaststatus"
version = "0.5.0"
edition = "2021"
description = "The Fastest Status Line for Claude Code, développée en Rust"
repository = "https://github.com/r9r-dev/ccfaststatus"
license = "WTFPL"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bincode = "1.3"
git2 = { version = "0.19", default-features = false, features = ["vendored-libgit2"] }
libc = "0.2"
terminal_size = "0.4"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
toml = { version = "0.8", default-features = false, features = ["parse", "display"] }
ratatui = { version = "0.28", default-features = false, features = ["crossterm"] }
crossterm = "0.28"

[dev-dependencies]
regex = "1"

[profile.release]
lto = "fat"
codegen-units = 1
strip = true
opt-level = 3
panic = "abort"
